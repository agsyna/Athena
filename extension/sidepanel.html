<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Athena</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- Compose: paste or edit the passage to be examined on. -->
    <section id="compose" class="view" hidden>
      <header class="head">
        <div class="brand">ATHENA</div>
        <p class="sub">A spoken viva on whatever you're studying.</p>
      </header>

      <label class="label" for="passage">Passage to be examined on</label>
      <textarea
        id="passage"
        class="passage"
        placeholder="Paste a few paragraphs here — lecture notes, a textbook section, anything you need to be able to explain out loud."
        spellcheck="false"
      ></textarea>

      <div class="row">
        <span id="count" class="count">0 characters</span>
        <button id="use-selection" class="link" type="button" hidden>
          Use highlighted text
        </button>
      </div>

      <p id="compose-error" class="error" role="alert" hidden></p>

      <button id="submit" class="primary" type="button" disabled>
        Start viva
      </button>

      <p class="fine">
        Tip: highlight text on a page before clicking the Athena icon and it
        lands here automatically.
      </p>
    </section>

    <!-- Transient status while a session is being created. -->
    <section id="status" class="view state" hidden>
      <div class="brand">ATHENA</div>
      <p id="status-message" class="message">Preparing your viva…</p>
      <p id="status-detail" class="detail"></p>
      <button id="status-back" class="button" hidden type="button">Back</button>
    </section>

    <!--
      The viva itself is served by the Athena app and embedded here.
      `allow="microphone"` delegates the microphone permission down to it, so the
      prompt comes from http://localhost — an origin Chrome will prompt for —
      rather than from the extension surface, where prompts are unreliable.
    -->
    <!--
      A thin bar above the viva. The panel cannot inspect a cross-origin frame,
      so "Open in a tab" is always available as an escape hatch, and the warning
      appears if the frame never reports that it hydrated.
    -->
    <div id="frame-bar" class="bar" hidden>
      <span id="frame-warning" class="bar-warning" hidden
        >Panel didn't load — open in a tab.</span
      >
      <a id="open-tab" class="link" href="#" target="_blank" rel="noopener"
        >Open in a tab ↗</a
      >
      <button id="frame-back" class="link" type="button">New passage</button>
    </div>

    <iframe
      id="viva"
      title="Athena viva"
      allow="microphone; autoplay"
      hidden
    ></iframe>

    <script src="sidepanel.js"></script>
  </body>
</html>
